name: Atomic Orange CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atomic-orange-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-contract:
    name: Governed contract (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        shell: pwsh
        run: corepack yarn install --immutable

      - name: Build canonical app frontend
        shell: pwsh
        run: corepack yarn build:web

      - name: Verify canonical app contracts
        shell: pwsh
        run: corepack yarn test:contracts

      - name: Check canonical Tauri package
        shell: pwsh
        run: corepack yarn check:tauri

      - name: Verify backend manifest resolver
        shell: pwsh
        run: bun test tests/upstream-backend-resolver.test.mjs
